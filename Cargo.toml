[workspace]
resolver = "2"
members = ["contracts/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[workspace.dependencies]
# Pinned to a revision of the SDK repository; bump both lines together.
massa-sc-sdk = { git = "https://github.com/massalabs/massa-rust-sc-sdk.git", rev = "ee71280687292e39ee71873867350a7227b7933d" }
massa-sc-standards = { git = "https://github.com/massalabs/massa-rust-sc-sdk.git", rev = "ee71280687292e39ee71873867350a7227b7933d" }

# Small, gas-efficient wasm (see massa-rust-sc-sdk/docs/size-and-gas.md).
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
